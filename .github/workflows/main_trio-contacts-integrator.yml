# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - trio-contacts-integrator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_b0356575ed974cdebf52c4472b8a8245 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_02d4d090f21c4e158648ae1971bae1af }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_b0356575ed974cdebf52c4472b8a8245 }}/contactsintegrator:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'trio-contacts-integrator'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_f3a2850ee3b84010aa4e909560616502 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_b0356575ed974cdebf52c4472b8a8245 }}/contactsintegrator:${{ github.sha }}'