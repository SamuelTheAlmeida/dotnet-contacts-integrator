# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - trio-contacts-integrator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_a986b93dd6a34eb598d018ec89cbc7b8 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_166911b2de1f4abe9bde5019cdc376fc }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_a986b93dd6a34eb598d018ec89cbc7b8 }}/trio-contacts-integrator:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'trio-contacts-integrator'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_dd862281aeda43e1bd6c65e5e325e58c }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_a986b93dd6a34eb598d018ec89cbc7b8 }}/trio-contacts-integrator:${{ github.sha }}'