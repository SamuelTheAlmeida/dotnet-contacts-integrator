# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}  # Ensures the workflow checks out the triggering branch
        fetch-depth: 0          # Fetches the full history
    - name: List files
      run: ls -R
    - name: Print current directory
      run: pwd
    - name: List files
      run: ls -al    
    - name: Locate solution file
      id: locate-sln
      run: |
        SLN_FILE=$(find . -name "*.sln" | head -n 1)
        if [ -z "$SLN_FILE" ]; then
          echo "No solution file found!"
          exit 1
        fi
        echo "Solution file found: $SLN_FILE"
        echo "sln=$SLN_FILE" >> $GITHUB_ENV
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ${{ env.sln }}
    - name: Build
      run: dotnet build --no-restore ${{ env.sln }}
    - name: Test
      run: dotnet test --no-build --verbosity normal ${{ env.sln }}
